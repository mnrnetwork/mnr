# mnr-relay configuration (Stage 0). Copy to relay.toml and edit.
#
# Caps default to the public-node rules in .claude/rules/public-nodes.md:
# 5 rps light calls, 2 concurrent get_blocks.bin streams, 10 MB/s per upstream.
# A missing cap means the default, never "unlimited".

listen = "127.0.0.1:18089"          # TLS is terminated in front of this
# user_agent = "mnr-relay/0.1 (+https://mnr.network/upstreams)"  # must identify mnr
# tor_socks = "127.0.0.1:9050"      # required if any upstream is transport = "onion"

# Operators who asked to be removed (rule 5). An upstream on this list is
# refused at load, not merely deprioritised. The list is public. The relay
# also reads https://<host>/.well-known/mnr-optout on every upstream host at
# start and daily: an HTTP 200 there takes the host out of rotation at once
# and logs an error asking for it to be added here.
opt_out = []

# Not configurable, stated for the record (rule 3): a read queues up to
# 250 ms for a light-call token on the best-ranked public upstream (1 s on
# the owned node) before trying the next one; streams are paced to `mbps`
# and cut after 15 s of upstream silence or 1 GiB.

[probe]
interval_secs = 15
clearnet_timeout_ms = 2000
onion_timeout_ms = 8000
min_agree = 3                        # upstreams that must agree on a tip hash

# Persistent token store and work-unit limiter. When set, tokens are managed
# with `mnr-relay token issue|rotate|suspend|list --config relay.toml`, and
# `--dev-token` is refused (no mixing). Raw tokens are never stored — only
# their SHA-256. The path is relative to the working directory, as with the
# other config paths. Leave unset to use `--dev-token` in memory.
[auth]
database = "relay.db"

# The relay's own header chain (plan §4): built once from the upstreams by
# majority (about an hour on mainnet, ~280 MB), extended every probe round,
# and the source of truth for by-height verification. Without a path it is
# kept in memory and rebuilt on every start.
[chain]
path = "headers.mnrh"
batch = 1000                          # headers per request; monerod's restricted limit

# In-memory cache (plan §5). Immutable data (blocks, headers, txs) is cached
# only below the tip safety line and only after verification; consensus
# state is served stale-while-revalidate (1/5/15 s) from a small tier.
[cache]
max_bytes = 1073741824               # 1 GiB for the immutable tier

# The storefront (plan §5): free tokens need only [auth] database; Pro
# invoices also need a view-only monero-wallet-rpc on loopback, started with
# --disable-rpc-login. Prices are atomic units per month, set by hand.
# client_ip_header is for a trusted proxy in front (Cloudflare's
# CF-Connecting-IP forwarded by Caddy) and is only accepted when `listen`
# is a loopback address.
[billing]
# wallet_rpc = "http://127.0.0.1:18082/json_rpc"
pro_price_atomic = 60000000000       # 0.06 XMR per month; update with the rate
confirmations = 10
free_per_day = 2000
per_client_per_hour = 3
months_max = 12
# client_ip_header = "CF-Connecting-IP"
secret_file = "invoice-secret"       # 32 random bytes, created on first start
cors_origin = "https://mnr.network"

# Prometheus /metrics: aggregate series only (never a token, path or client
# address). Bind it to a private interface; leave unset to disable.
[metrics]
listen = "127.0.0.1:9187"

[[upstreams]]
name = "own-1"
url = "https://node.kyc.rip"         # our full node (public, TLS on 443)
kind = "owned"
transport = "https"
caps = { rps_light = 500, max_streams = 32, mbps = 200 }

[[upstreams]]
name = "cakewallet"
url = "https://xmr-node.cakewallet.com:18081"
kind = "public"
transport = "https"

[[upstreams]]
name = "sethforprivacy"
url = "https://node.sethforprivacy.com"
kind = "public"
transport = "https"

[[upstreams]]
name = "monerodevs-1"
url = "http://node.monerodevs.org:18089"
kind = "public"
transport = "http"

[[upstreams]]
name = "hashvault"
url = "http://nodes.hashvault.pro:18081"
kind = "public"
transport = "http"
